spring.application.name=scrabble-ods-api
# H2 en mémoire
spring.datasource.url=jdbc:h2:mem:ods9db
spring.datasource.driver-class-name=org.h2.Driver

# Console H2 accessible sur http://localhost:8080/h2-console (pratique pour débugger)
spring.h2.console.enabled=true

# Hibernate crée/recrée les tables au démarrage selon tes entités
# "create-drop" = crée au start, supprime à l'arrêt
spring.jpa.hibernate.ddl-auto=create-drop

## Voir les requêtes SQL générées dans les logs
#spring.jpa.show-sql=true