spring.application.name=scrabble-ods-api

# H2 en mémoire
spring.datasource.url=jdbc:h2:file:./data/ods9db
spring.datasource.driver-class-name=org.h2.Driver

# Console H2 accessible sur http://localhost:8080/h2-console (pratique pour débugger)
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
